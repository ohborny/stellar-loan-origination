; ---------------------------------------------------------------------------
; loanapp.ini
; Added 2016-03-11 by dkirkendall.
;
; The idea here was that we'd stop editing PHP files every time Finance or
; Ops wanted a number changed. That mostly did not happen. Roughly half the
; app reads this file (through includes/config_loader.php) and the other half
; still reads the define()s in public/db_config.php and the hardcoded values
; in public/apply.php. Where a key exists in both places the values do NOT
; agree, and I honestly don't remember which one wins in which code path.
;
; If you change something in here and nothing happens, the value you want is
; probably still hardcoded somewhere. Grep first. -- dk
;
; 2025 note (avaldez): // ??? do not know which of these are live. Left alone.
; ---------------------------------------------------------------------------

[db]
; NOTE: these are NOT what get_db() actually uses. get_db() uses the DB_PATH
; define() in public/db_config.php. This section is believed unused but
; something in the tools/ directory may still read it, so it stays.
driver              = sqlite
path                = /var/www/loanapp/data/loans.db
; old MySQL box, decommissioned 2020. kept for the isset() checks in
; includes/legacy_compat.php. believed unused.
mysql_host          = 10.14.22.9
mysql_user          = loanapp_svc
mysql_pass          = Winter2015!
mysql_name          = loanorig
timeout_seconds     = 5
persistent          = 0
; believed unused (nothing calls a retry helper with this)
retry_attempts      = 3

[app]
app_name            = LoanApp
environment         = production
base_url            = http://loanapp.mtf.internal/
; db_config.php has no equivalent define for this; apply.php just uses
; date('c') with whatever the server TZ is. See LOAN-2811.
timezone            = America/Chicago
session_name        = LOANAPPSESS
session_timeout_min = 480
; believed unused. left over from a 2017 attempt at a maintenance banner.
maintenance_mode    = 0
maintenance_message = "System unavailable, please try again later."
debug               = 1

[underwriting]
; !!! These DUPLICATE the hardcoded numbers in public/apply.php and the
; !!! define()s elsewhere, and they do not match. apply.php allows up to
; !!! 75000 (auto loans, 2019); this file still says 50000 from when we
; !!! only did unsecured personal loans. Nobody reconciled it.
min_loan_amount     = 1000
max_loan_amount     = 50000
min_term_months     = 12
max_term_months     = 84
min_credit_score    = 580
; apply.php uses 0.43 as the Tier C ceiling. This says 0.45. Unclear which
; one Risk signed off on; the policy doc could not be found in the 2020 audit.
max_dti             = 0.45
tier_d_enabled      = 1
; large-loan surcharge threshold. apply.php hardcodes 25000, admin.php
; hardcodes 40000 (LOAN-1341). This file says 30000, which matches neither.
large_loan_threshold = 30000
large_loan_surcharge = 0.0040
auto_approve_below  = 5000

[partner]
; dealer partner network, 2023 (LOAN-2077)
enabled             = 1
shared_username     = partner_svc
; LOAN-SEC-19: single shared login for every dealer, no per-dealer identity
shared_password     = Winter2015!
xml_max_bytes       = 262144
name_truncate_len   = 30
allowed_dealer_codes = "MTF001,MTF002,MTF014,BRW009,LKS221"
; believed unused - the reverse proxy does the IP filtering now
allow_ip_range      = 10.14.0.0/16

[batch]
; the Perl nightly job reads its own config out of batch/, not this file.
nightly_hour        = 2
funding_batch_size  = 250
; LOAN-2388: retried runs double-fund. This flag was supposed to help.
; It is not read by anything.
idempotency_enabled = 1
reconcile_log_table = apr_variance
archive_dir         = /var/www/loanapp/data/archive

[mail]
smtp_host           = mail.mtf.internal
smtp_port           = 25
from_address        = noreply@meridiantrust.example
; believed unused - comm_log rows show sends going out with no BCC
bcc_compliance      = compliance@meridiantrust.example
disclosure_template = disclosure_2016.tpl

[legacy]
; HSG-era switches. rwhitfield put these in the original build and dk moved
; them here in 2016. Nobody has audited them since.
hsg_compat_mode     = 1
hsg_date_fixups     = 1
hsg_strict_escaping = 0
old_admin_ui        = 0

[deprecated_2018]
; Everything below was slated for deletion in the 2018 cleanup that never
; happened (LOAN-1502 was part of that same effort and is also still open).
; Deleting this section is "safe" per a 2018 email nobody can find, so of
; course it is still here.
tier_d_pilot_end    = 2018-06-30
tier_d_pilot_cap    = 15000
old_rate_file       = conf/rates.txt
legacy_export_path  = /mnt/nfs/loanapp_exports
enable_fax_delivery = 1
fax_gateway         = fax.mtf.internal
